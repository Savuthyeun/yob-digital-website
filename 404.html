<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — YOB Digital</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kantumruy+Pro:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" /></noscript>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html, body { background: #06080f !important; overflow: hidden; height: 100%; margin: 0; }
      .blob-1, .blob-2, #nav-placeholder, .mobile-drawer,
      nav, .nav-mobile-drop { display: none !important; }

      #v-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

      /* Title + button — bottom area, fades in after 404 forms */
      .v-bottom {
        position: fixed;
        bottom: 12vh; left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.9s ease;
      }
      .v-bottom.visible { opacity: 1; pointer-events: auto; }

      .v-title {
        font-family: var(--fb);
        font-size: clamp(15px, 2.2vw, 20px);
        font-weight: 700;
        color: var(--white);
        margin: 0 0 6px;
      }
      .v-sub {
        font-family: var(--fb);
        font-size: 13px;
        color: var(--gray);
        margin: 0 0 24px;
      }
      .v-replay {
        display: block; margin: 14px auto 0;
        font-family: var(--fb); font-size: 10px;
        letter-spacing: 1.5px; text-transform: uppercase;
        color: rgba(255,255,255,0.18);
        cursor: pointer; background: none; border: none;
        transition: color 0.25s;
      }
      .v-replay:hover { color: rgba(255,255,255,0.5); }
    </style>
  </head>
  <body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <canvas id="v-canvas" aria-hidden="true"></canvas>

    <div id="nav-placeholder"></div>
    <div class="mobile-drawer" id="mobileDrawer">
      <button class="drawer-close" id="drawerClose"><i class="fas fa-times"></i></button>
      <a href="index.html" onclick="closeDrawer()">Home</a>
    </div>

    <div class="v-bottom" id="vBottom">
      <h1 class="v-title">ទំព័រនេះបាត់ចូលក្នុងអវកាស</h1>
      <p class="v-sub">URL ខុស ឬ ទំព័រនោះលែងមានទៀតហើយ</p>
      <a href="index.html" class="btn-primary">
        <i class="fas fa-arrow-left"></i> ត្រលប់ YOB
      </a>
      <button class="v-replay" id="vReplay">▶ មើលម្តងទៀត</button>
    </div>

    <script>
    document.fonts.ready.then(function () {
      (function () {
        const canvas  = document.getElementById('v-canvas');
        const ctx     = canvas.getContext('2d');
        const bottom  = document.getElementById('vBottom');
        let W, H, cx, cy;

        function resize() {
          W = canvas.width  = window.innerWidth;
          H = canvas.height = window.innerHeight;
          cx = W / 2; cy = H / 2;
        }

        /* ── Starfield ── */
        let stars = [];
        function initStars() {
          stars = [];
          const n = Math.floor(W * H / 3600);
          for (let i = 0; i < n; i++) stars.push({
            x: Math.random() * W, y: Math.random() * H,
            r: Math.random() * 1.0 + 0.2,
            o: Math.random() * 0.5 + 0.15,
            sp: Math.random() * 0.002 + 0.001,
            ph: Math.random() * Math.PI * 2
          });
        }

        /* ── Sample "404" pixel positions from offscreen canvas ── */
        function get404Targets() {
          const size  = Math.min(W * 0.92, 680);
          const fsize = Math.floor(size * 0.42);
          const tw    = size;
          const th    = Math.floor(fsize * 1.2);

          const off   = document.createElement('canvas');
          off.width   = tw; off.height = th;
          const oc    = off.getContext('2d');
          oc.font     = fsize + 'px "Bebas Neue"';
          oc.fillStyle = '#fff';
          oc.textAlign = 'center';
          oc.textBaseline = 'middle';
          oc.fillText('404', tw / 2, th / 2);

          const data  = oc.getImageData(0, 0, tw, th).data;
          const step  = Math.max(4, Math.floor(size / 110));
          const ox    = cx - tw / 2;
          const oy    = cy - th / 2 - Math.min(80, H * 0.09);
          const pts   = [];

          for (let y = 0; y < th; y += step) {
            for (let x = 0; x < tw; x += step) {
              if (data[(y * tw + x) * 4 + 3] > 128) {
                pts.push({
                  x: ox + x + (Math.random() - 0.5) * step * 0.4,
                  y: oy + y + (Math.random() - 0.5) * step * 0.4
                });
              }
            }
          }
          // shuffle
          for (let i = pts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pts[i], pts[j]] = [pts[j], pts[i]];
          }
          return pts;
        }

        /* ── Planet drawing ── */
        const CA = [{ox:-16,oy:-10,r:9},{ox:8,oy:14,r:6},{ox:-4,oy:6,r:4},{ox:14,oy:-4,r:3}];
        const CB = [{ox:8,oy:-6,r:6},{ox:-7,oy:7,r:4},{ox:3,oy:-1,r:2.5}];

        function drawPlanet(x, y, r, light, dark, craters) {
          const g = ctx.createRadialGradient(x-r*0.32, y-r*0.32, r*0.05, x, y, r);
          g.addColorStop(0, light); g.addColorStop(0.65, dark); g.addColorStop(1, '#111');
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
          ctx.fillStyle = g; ctx.fill();
          craters.forEach(c => {
            ctx.beginPath(); ctx.arc(x+c.ox, y+c.oy, c.r, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
          });
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
          ctx.strokeStyle = 'rgba(255,235,190,0.14)'; ctx.lineWidth = 1.5; ctx.stroke();
        }

        /* ── Particles ── */
        let particles = [];
        let targets   = [];

        function spawnExplosion(mx, my) {
          targets = get404Targets();

          // Rock debris — will home to 404 targets
          const rockCount = targets.length + 30;
          for (let i = 0; i < rockCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 7 + 1.5;
            particles.push({
              x: mx, y: my,
              vx: Math.cos(angle) * speed * (0.4 + Math.random() * 0.8),
              vy: Math.sin(angle) * speed * (0.4 + Math.random() * 0.8),
              r: Math.random() * 3.2 + 1.0,
              life: 1.0,
              col: [
                Math.floor(Math.random()*70+95),
                Math.floor(Math.random()*55+70),
                Math.floor(Math.random()*45+55)
              ],
              target: i < targets.length ? targets[i] : null,
              settled: false,
              spark: false,
            });
          }

          // Hot sparks — fly out and fade
          for (let i = 0; i < 80; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 14 + 5;
            particles.push({
              x: mx, y: my,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              r: Math.random() * 1.2 + 0.4,
              life: 1.0,
              decay: Math.random() * 0.022 + 0.012,
              col: [255, Math.floor(Math.random()*100+130), 20],
              spark: true,
            });
          }
        }

        /* ── Scene state ── */
        let state, p1, p2, flashAlpha, t, explodeFrames;

        function initScene() {
          state        = 'approach';
          flashAlpha   = 0;
          explodeFrames = 0;
          t            = 0;
          particles    = [];
          targets      = [];
          bottom.classList.remove('visible');
          const r1 = Math.min(52, W * 0.13);
          const r2 = Math.min(37, W * 0.09);
          p1 = { x: cx - W*0.55, y: cy+15, r: r1, vx: W*0.0055, vy: -0.15 };
          p2 = { x: cx + W*0.48, y: cy-12, r: r2, vx: -W*0.007, vy:  0.25 };
        }

        function loop() {
          requestAnimationFrame(loop);
          ctx.clearRect(0, 0, W, H);
          t++;

          // Stars
          stars.forEach(s => {
            const o = s.o * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,' + o + ')'; ctx.fill();
          });

          /* APPROACH */
          if (state === 'approach') {
            p1.x += p1.vx; p1.y += p1.vy;
            p2.x += p2.vx; p2.y += p2.vy;

            [p1, p2].forEach((p, i) => {
              const dir = i === 0 ? 1 : -1;
              for (let j = 1; j <= 5; j++) {
                ctx.beginPath();
                ctx.moveTo(p.x - dir*j*p.r*0.35, p.y);
                ctx.lineTo(p.x - dir*(j+1)*p.r*0.35, p.y);
                ctx.strokeStyle = 'rgba(255,235,180,' + (0.04 - j*0.006) + ')';
                ctx.lineWidth = p.r * 0.18; ctx.stroke();
              }
            });

            drawPlanet(p1.x, p1.y, p1.r, '#957a62', '#4c3a28', CA);
            drawPlanet(p2.x, p2.y, p2.r, '#7a8f72', '#3a4a34', CB);

            const dx = p1.x - p2.x, dy = p1.y - p2.y;
            if (Math.sqrt(dx*dx + dy*dy) < p1.r + p2.r - 8) {
              state = 'impact';
              flashAlpha = 1.0;
              spawnExplosion((p1.x*0.52 + p2.x*0.48), (p1.y*0.52 + p2.y*0.48));
            }
          }

          /* IMPACT → EXPLODE → CONVERGE */
          if (state === 'impact' || state === 'explode' || state === 'converge') {
            // White flash
            if (flashAlpha > 0) {
              ctx.fillStyle = 'rgba(255,235,180,' + flashAlpha + ')';
              ctx.fillRect(0, 0, W, H);
              flashAlpha -= 0.055;
              if (flashAlpha <= 0) { flashAlpha = 0; state = 'explode'; }
            }

            if (state === 'explode') {
              explodeFrames++;
              if (explodeFrames > 68) state = 'converge';
            }

            let settledCount = 0;
            let rockTotal    = 0;

            for (let i = 0; i < particles.length; i++) {
              const p = particles[i];
              if (p.life <= 0) continue;

              if (p.spark) {
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.96; p.vy *= 0.96;
                p.life -= (p.decay || 0.014);
                if (p.life < 0) p.life = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.2, p.r * p.life), 0, Math.PI*2);
                const [r,g,b] = p.col;
                ctx.fillStyle = 'rgba('+r+','+g+','+b+','+p.life+')'; ctx.fill();
                continue;
              }

              rockTotal++;

              if (state === 'converge' && p.target && !p.settled) {
                const dx = p.target.x - p.x;
                const dy = p.target.y - p.y;
                const d2 = dx*dx + dy*dy;
                const ease = 0.05 + Math.min(0.05, 300 / (d2 + 1));
                p.vx = (p.vx + dx * ease) * 0.80;
                p.vy = (p.vy + dy * ease) * 0.80;
                p.x += p.vx; p.y += p.vy;
                // Whiten gradually
                p.col[0] = Math.min(255, p.col[0] + 5);
                p.col[1] = Math.min(255, p.col[1] + 4);
                p.col[2] = Math.min(255, p.col[2] + 4);
                if (d2 < 6) { p.x = p.target.x; p.y = p.target.y; p.vx = 0; p.vy = 0; p.settled = true; p.col = [255,255,255]; p.ox = p.x; p.oy = p.y; p.ph = Math.random() * Math.PI * 2; }
              } else if (!p.target && state === 'converge') {
                p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life -= 0.02;
              } else {
                p.x += p.vx; p.y += p.vy; p.vx *= 0.975; p.vy *= 0.975; p.vy += 0.05;
              }

              if (p.settled) settledCount++;
              const [r,g,b] = p.col;
              const a = p.settled ? 0.92 : p.life;
              ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
              ctx.fillStyle = 'rgba('+r+','+g+','+b+','+a+')'; ctx.fill();
            }

            if (state === 'converge' && rockTotal > 0 && settledCount / rockTotal > 0.93) {
              state = 'formed';
              bottom.classList.add('visible');
            }
          }

          /* FORMED / IDLE — animate settled 404 particles */
          if (state === 'formed' || state === 'idle') {
            if (state === 'formed') state = 'idle';
            particles.forEach(p => {
              if (p.spark || !p.settled) return;
              // Wave: propagates left→right, gentle y float
              const wave  = Math.sin(t * 0.038 + p.ox * 0.016 + p.ph * 0.3) * 2.8;
              // Breathe: alpha pulses
              const alpha = 0.70 + 0.22 * Math.sin(t * 0.045 + p.ox * 0.012 + p.ph);
              // Shimmer: occasional pink glow
              const pink  = Math.max(0, Math.sin(t * 0.06 + p.ph * 2.5 + p.oy * 0.02));
              const pr    = Math.floor(255);
              const pg    = Math.floor(255 * (1 - pink * 0.82));
              const pb    = Math.floor(255 * (1 - pink * 0.60));
              ctx.beginPath();
              ctx.arc(p.ox, p.oy + wave, p.r * (1 + pink * 0.35), 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(' + pr + ',' + pg + ',' + pb + ',' + alpha + ')';
              ctx.fill();
            });
          }
        }

        document.getElementById('vReplay').addEventListener('click', function () {
          initScene();
        });

        resize(); initStars(); initScene(); loop();
        window.addEventListener('resize', () => { resize(); initStars(); initScene(); });
      })();
    });
    </script>
    <script src="js/load-components.js"></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
