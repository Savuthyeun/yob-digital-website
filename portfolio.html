    <style>
      /* ── Page ── */
      .pf-page { padding-top: 68px; }

      /* ── Sticky filter bar ── */
      .pf-bar {
        position: sticky;
        top: 68px;
        z-index: 90;
        background: rgba(8,11,16,0.9);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--border);
        padding: 0 40px;
        display: flex;
        align-items: center;
        height: 56px;
        gap: 0;
      }
      .pf-bar-title {
        font-family: var(--fh);
        font-size: 18px;
        letter-spacing: 2px;
        color: rgba(255,255,255,0.4);
        margin-right: 28px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .pf-bar-title span { color: var(--gold); }
      .pf-tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
        flex: 1;
      }
      .pf-tabs::-webkit-scrollbar { display: none; }
      .pf-tab {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 16px;
        border-radius: 6px;
        border: none;
        background: transparent;
        font-family: var(--fb);
        font-size: 12px;
        font-weight: 500;
        color: var(--gray);
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.2s, background 0.2s;
        position: relative;
      }
      .pf-tab::after {
        content: "";
        position: absolute;
        bottom: -1px; left: 16px; right: 16px;
        height: 2px;
        background: var(--gold);
        border-radius: 2px 2px 0 0;
        transform: scaleX(0);
        transition: transform 0.25s cubic-bezier(0.16,1,0.3,1);
      }
      .pf-tab:hover { color: var(--white); background: rgba(255,255,255,0.04); }
      .pf-tab.active { color: var(--white); }
      .pf-tab.active::after { transform: scaleX(1); }
      .pf-tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
      .pf-tab-count { font-size: 10px; color: rgba(255,255,255,0.28); }
      .pf-tab.active .pf-tab-count { color: rgba(255,255,255,0.5); }

      /* ── Client chips row (slides in below bar) ── */
      .pf-chips-row {
        position: sticky;
        top: 124px; /* 68px nav + 56px bar */
        z-index: 89;
        background: rgba(8,11,16,0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid transparent;
        padding: 0 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.35s cubic-bezier(0.16,1,0.3,1),
                    border-color 0.35s,
                    padding 0.35s cubic-bezier(0.16,1,0.3,1);
      }
      .pf-chips-row.open {
        max-height: 56px;
        padding-top: 10px;
        padding-bottom: 10px;
        border-bottom-color: var(--border);
      }
      .pf-chips-label {
        font-family: var(--fb);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.2);
        white-space: nowrap;
        flex-shrink: 0;
        margin-right: 4px;
      }
      .pf-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 14px;
        border-radius: 50px;
        border: 1px solid var(--border2);
        background: transparent;
        font-family: var(--fb);
        font-size: 12px;
        font-weight: 500;
        color: var(--gray);
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.2s, background 0.2s, border-color 0.2s;
      }
      .pf-chip:hover { color: var(--white); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.04); }
      .pf-chip.active { color: var(--white); background: rgba(229,44,103,0.15); border-color: var(--gold); }

      /* ── Cover grid ── */
      .pf-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        padding: 3px;
        min-height: 60vh;
      }

      /* ── Micro-interaction keyframes ── */
      @keyframes pf-fadeUp {
        from { opacity: 0; transform: translateY(22px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes pf-panIn {
        from { opacity: 0; transform: scale(0.93); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes pf-chipIn {
        from { opacity: 0; transform: translateX(-10px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes pf-lbNext {
        from { opacity: 0; transform: translateX(36px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes pf-lbPrev {
        from { opacity: 0; transform: translateX(-36px); }
        to   { opacity: 1; transform: none; }
      }

      /* ── Cover card ── */
      .pf-cover {
        position: relative;
        overflow: hidden;
        cursor: pointer;
        background: var(--dark2);
        border-radius: 4px;
        aspect-ratio: 3 / 4; /* default — overridden inline per client */
        opacity: 0; /* animated in by JS */
      }
      .pf-cover img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.55s cubic-bezier(0.16,1,0.3,1);
        will-change: transform;
      }
      /* hover scale handled by JS parallax — CSS fallback for touch */
      @media (hover: none) {
        .pf-cover:hover img { transform: scale(1.04); }
      }

      /* Gradient overlay */
      .pf-cov-overlay {
        position: absolute; inset: 0;
        background: linear-gradient(
          to top,
          rgba(6,8,15,0.95) 0%,
          rgba(6,8,15,0.3) 40%,
          transparent 65%
        );
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px 22px;
        transition: background 0.35s ease;
      }
      .pf-cover:hover .pf-cov-overlay {
        background: linear-gradient(
          to top,
          rgba(6,8,15,0.98) 0%,
          rgba(6,8,15,0.5) 50%,
          rgba(6,8,15,0.1) 80%
        );
      }

      /* Service badge top-left */
      .pf-cov-badge {
        position: absolute;
        top: 16px; left: 16px;
        font-family: var(--fb);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 4px 10px;
        border-radius: 50px;
      }
      .pf-cov-badge[data-cat="design"]    { background: rgba(229,44,103,0.18); color: #e52c67; border: 1px solid rgba(229,44,103,0.45); }
      .pf-cov-badge[data-cat="marketing"] { background: rgba(251,113,133,0.18); color: #fb7185; border: 1px solid rgba(251,113,133,0.45); }
      .pf-cov-badge[data-cat="web"]       { background: rgba(79,130,255,0.18);  color: #4f82ff; border: 1px solid rgba(79,130,255,0.45); }
      .pf-cov-badge[data-cat="event"]     { background: rgba(74,222,128,0.18);  color: #4ade80; border: 1px solid rgba(74,222,128,0.45); }

      /* Work count top-right */
      .pf-cov-count {
        position: absolute;
        top: 16px; right: 16px;
        font-family: var(--fb);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        color: rgba(255,255,255,0.45);
        background: rgba(6,8,15,0.6);
        padding: 4px 10px;
        border-radius: 50px;
        border: 1px solid var(--border2);
      }

      /* Text info */
      .pf-cov-meta {
        font-family: var(--fb);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
        margin-bottom: 5px;
        transform: translateY(4px);
        opacity: 0;
        transition: opacity 0.3s ease 0.05s, transform 0.3s ease 0.05s;
      }
      .pf-cov-name {
        font-family: var(--fh);
        font-size: clamp(22px, 3vw, 36px);
        color: var(--white);
        line-height: 1;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
      .pf-cov-action {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--fb);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gold);
        transform: translateY(6px);
        opacity: 0;
        transition: opacity 0.3s ease 0.1s, transform 0.3s ease 0.1s;
      }
      .pf-cover:hover .pf-cov-meta,
      .pf-cover:hover .pf-cov-action { opacity: 1; transform: none; }

      /* Empty state */
      .pf-empty {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 24px;
        text-align: center;
        gap: 12px;
      }
      .pf-empty i { font-size: 32px; opacity: 0.2; }
      .pf-empty p { font-family: var(--fb); font-size: 14px; color: var(--gray); }

      /* ── Client Panel (popup) ── */
      .pf-panel {
        position: fixed;
        inset: 0;
        z-index: 600;
        background: var(--dark);
        transform: translateY(100%);
        transition: transform 0.52s cubic-bezier(0.16,1,0.3,1);
        overflow-y: auto;
        overflow-x: hidden;
      }
      .pf-panel.open { transform: translateY(0); }

      /* Panel top bar */
      .pf-pan-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(8,11,16,0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--border);
        height: 60px;
        display: flex;
        align-items: center;
        padding: 0 32px;
        gap: 20px;
      }
      .pf-pan-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--fb);
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gray);
        background: none;
        border: none;
        cursor: pointer;
        transition: color 0.2s;
        padding: 0;
        flex-shrink: 0;
      }
      .pf-pan-back:hover { color: var(--white); }
      .pf-pan-bar-title {
        font-family: var(--fh);
        font-size: 20px;
        letter-spacing: 1px;
        color: var(--white);
      }
      .pf-pan-bar-tag {
        font-family: var(--fb);
        font-size: 11px;
        color: var(--gray);
        margin-left: 4px;
      }
      .pf-pan-bar-count {
        margin-left: auto;
        font-family: var(--fb);
        font-size: 11px;
        color: rgba(255,255,255,0.25);
        white-space: nowrap;
      }

      /* Panel hero */
      .pf-pan-hero {
        display: flex;
        align-items: flex-end;
        gap: 32px;
        padding: 48px 40px 36px;
        border-bottom: 1px solid var(--border);
      }
      .pf-pan-logo {
        width: 72px; height: 72px;
        border-radius: 16px;
        background: var(--dark2);
        border: 1px solid var(--border2);
        display: flex; align-items: center; justify-content: center;
        font-size: 28px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .pf-pan-logo img {
        width: 100%; height: 100%;
        object-fit: contain;
        padding: 8px;
      }
      .pf-pan-info { flex: 1; }
      .pf-pan-name {
        font-family: var(--fh);
        font-size: clamp(40px, 6vw, 72px);
        color: var(--white);
        line-height: 0.9;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
      .pf-pan-sub {
        font-family: var(--fb);
        font-size: 13px;
        color: var(--gray);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pf-pan-sub .pf-cov-badge { position: static; }

      /* Panel works grid */
      .pf-pan-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        padding: 3px;
      }
      .pf-pan-item {
        position: relative;
        overflow: hidden;
        cursor: zoom-in;
        background: var(--dark2);
        aspect-ratio: 3 / 4; /* default — overridden inline per client */
        border-radius: 3px;
        opacity: 0; /* animated in by JS */
      }
      .pf-pan-item img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
      }
      .pf-pan-item:hover img { transform: scale(1.05); }
      .pf-pan-item-overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(6,8,15,0.85) 0%, transparent 55%);
        opacity: 0;
        transition: opacity 0.3s ease;
        display: flex; align-items: flex-end;
        padding: 14px 12px;
      }
      .pf-pan-item:hover .pf-pan-item-overlay { opacity: 1; }
      .pf-pan-item-name {
        font-family: var(--fb);
        font-size: 12px;
        font-weight: 600;
        color: var(--white);
      }

      /* ── Lightbox ── */
      .pf-lb {
        position: fixed; inset: 0;
        background: rgba(4,5,10,0.97);
        z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.28s ease;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .pf-lb.open { opacity: 1; pointer-events: all; }
      .pf-lb-inner { position: relative; max-width: min(88vw, 560px); width: 100%; }
      .pf-lb-img { width: 100%; border-radius: 10px; display: block; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
      .pf-lb-info { margin-top: 14px; text-align: center; }
      .pf-lb-client { font-family: var(--fb); font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 3px; }
      .pf-lb-name   { font-family: var(--fb); font-size: 14px; font-weight: 600; color: var(--white); }
      .pf-lb-close  { position: absolute; top: -44px; right: 0; background: none; border: none; color: rgba(255,255,255,0.45); font-size: 18px; cursor: pointer; padding: 8px; transition: color 0.2s; }
      .pf-lb-close:hover { color: var(--white); }
      .pf-lb-nav { position: absolute; top: 42%; transform: translateY(-50%); background: rgba(255,255,255,0.06); border: 1px solid var(--border2); color: var(--white); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; transition: background 0.2s, border-color 0.2s; }
      .pf-lb-nav:hover { background: var(--gold); border-color: var(--gold); }
      .pf-lb-prev { left: -60px; }
      .pf-lb-next { right: -60px; }
      .pf-lb-counter { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); font-family: var(--fb); font-size: 11px; color: rgba(255,255,255,0.22); white-space: nowrap; }
      .pf-lb-img.dir-next { animation: pf-lbNext 0.32s cubic-bezier(0.16,1,0.3,1) both; }
      .pf-lb-img.dir-prev { animation: pf-lbPrev 0.32s cubic-bezier(0.16,1,0.3,1) both; }

      /* ── Responsive ── */
      @media (max-width: 900px) {
        .pf-grid { grid-template-columns: repeat(2, 1fr); }
        .pf-pan-grid { grid-template-columns: repeat(3, 1fr); }
        .pf-pan-hero { padding: 32px 24px 28px; }
      }
      @media (max-width: 600px) {
        .pf-grid { grid-template-columns: repeat(2, 1fr); }
        .pf-pan-grid { grid-template-columns: repeat(2, 1fr); }
        .pf-bar { padding: 0 16px; }
        .pf-bar-title { display: none; }
        .pf-chips-row { padding: 0 16px; top: 124px; }
        .pf-chips-row.open { padding-top: 10px; padding-bottom: 10px; }
        .pf-chips-label { display: none; }
        .pf-pan-bar { padding: 0 16px; }
        .pf-lb-inner { max-width: 90vw; }
        .pf-lb-prev { left: -36px; }
        .pf-lb-next { right: -36px; }
        .pf-lb-nav { width: 34px; height: 34px; }
      }
    </style>
  </head>
  <body>

    <div class="cursor-outline"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

      <button class="drawer-close" id="drawerClose"><i class="fas fa-times"></i></button>

          <a href="index.html#videos" onclick="closeDrawer()">Tutorial</a>

          <a href="case-studies.html" onclick="closeDrawer()">Case Studies</a>
        </div>
      </div>
      <div class="drawer-group">
        <button class="drawer-group-toggle">Products <i class="fas fa-chevron-down"></i></button>
        <div class="drawer-group-items">
          <a href="yobfont.html" onclick="closeDrawer()">Yob Fonts</a>

    </div>

    <div class="pf-page">

      <!-- ══ STICKY FILTER BAR ══ -->
      <div class="pf-bar">
        <span class="pf-bar-title">កម្រង<span>ស្នាដៃ</span></span>
        <!-- Category tabs (left) -->
        <div class="pf-tabs" id="pfTabs">
          <button class="pf-tab active" data-cat="all">ទាំងអស់ <span class="pf-tab-count" id="cnt-all"></span></button>
          <button class="pf-tab" data-cat="design">
            <span class="pf-tab-dot" style="background:#e52c67"></span>
            Graphic Design <span class="pf-tab-count" id="cnt-design"></span>
          </button>
          <button class="pf-tab" data-cat="marketing">
            <span class="pf-tab-dot" style="background:#fb7185"></span>
            Digital Marketing <span class="pf-tab-count" id="cnt-marketing"></span>
          </button>
          <button class="pf-tab" data-cat="web">
            <span class="pf-tab-dot" style="background:#4f82ff"></span>
            Web Design <span class="pf-tab-count" id="cnt-web"></span>
          </button>
          <button class="pf-tab" data-cat="event">
            <span class="pf-tab-dot" style="background:#4ade80"></span>
            Event <span class="pf-tab-count" id="cnt-event"></span>
          </button>
        </div>
      </div>

      <!-- ══ CLIENT CHIPS ROW (slides in when category selected) ══ -->
      <div class="pf-chips-row" id="pfChipsRow">

      </div>

      <!-- ══ COVER GRID (1 card per client) ══ -->
      <div class="pf-grid" id="pfGrid"></div>


    </div>

    <!-- ══ CLIENT PANEL ══ -->
    <div class="pf-panel" id="pfPanel">
      <div class="pf-pan-bar">
        <button class="pf-pan-back" id="pfPanBack">
          <i class="fas fa-arrow-left"></i> ត្រលប់
        </button>
        <span class="pf-pan-bar-title" id="pfPanBarTitle"></span>
        <span class="pf-pan-bar-tag"  id="pfPanBarTag"></span>
        <span class="pf-pan-bar-count" id="pfPanBarCount"></span>
      </div>
      <div class="pf-pan-hero">
        <div class="pf-pan-logo" id="pfPanLogo"></div>
        <div class="pf-pan-info">
          <div class="pf-pan-name" id="pfPanName"></div>
          <div class="pf-pan-sub">
            <span class="pf-cov-badge" id="pfPanBadge"></span>
            <span id="pfPanTagline"></span>
          </div>
        </div>
      </div>
      <div class="pf-pan-grid" id="pfPanGrid"></div>
    </div>

    <!-- ══ LIGHTBOX ══ -->
    <div class="pf-lb" id="pfLb">
      <div class="pf-lb-inner">
        <button class="pf-lb-close" id="pfLbClose"><i class="fas fa-times"></i></button>
        <img class="pf-lb-img" id="pfLbImg" src="" alt="" />
        <div class="pf-lb-info">
          <div class="pf-lb-client" id="pfLbClient"></div>
          <div class="pf-lb-name"   id="pfLbName"></div>
        </div>
        <button class="pf-lb-nav pf-lb-prev" id="pfLbPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="pf-lb-nav pf-lb-next" id="pfLbNext"><i class="fas fa-chevron-right"></i></button>
        <div class="pf-lb-counter" id="pfLbCtr"></div>
      </div>
    </div>

    <div class="float-contact">
      <a href="https://t.me/yobdigital" class="fl-btn tg" data-tip="Telegram YOB" target="_blank" rel="noopener">
        <i class="fab fa-telegram-plane"></i>
      </a>
    </div>
    <button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">
      <i class="fas fa-chevron-up"></i>
    </button>
    <div id="footer-placeholder"></div>

    <script>
    /* ══════════════════════════════════════════
       CLIENT DATA — add new clients here
    ══════════════════════════════════════════ */
    var CLIENTS = [
      {
        id:      'e-express',
        name:    'E Express',
        emoji:   '🚚',
        logo:    'images/case-studies/e-express/logo.webp',
        cat:     'design',
        catLabel:'Graphic Design',
        aspect:  '1/1',
        tagline: 'Poster Design · Brand Visual · 2025',
        works: [
          { img: 'images/case-studies/e-express/poster-01.jpg', name: 'Campaign Poster 01' },
          { img: 'images/case-studies/e-express/poster-02.jpg', name: 'Campaign Poster 02' },
          { img: 'images/case-studies/e-express/poster-03.jpg', name: 'Campaign Poster 03' },
          { img: 'images/case-studies/e-express/poster-04.jpg', name: 'Campaign Poster 04' },
          { img: 'images/case-studies/e-express/poster-05.jpg', name: 'Campaign Poster 05' },
          { img: 'images/case-studies/e-express/poster-06.jpg', name: 'Campaign Poster 06' },
          { img: 'images/case-studies/e-express/poster-07.jpg', name: 'Campaign Poster 07' },
          { img: 'images/case-studies/e-express/poster-08.jpg', name: 'Campaign Poster 08' },
        ]
      },
      /* ── Add more clients below ──
      {
        id:      'client-id',
        name:    'Client Name',
        emoji:   '🏢',
        cat:     'web',          // design | marketing | web | event
        catLabel:'Web Design',
        tagline: 'Website · Landing Page · 2025',
        works: [
          { img: 'images/...', name: 'Project Name' },
        ]
      },
      */
    ];

    (function () {
      var pfGrid  = document.getElementById('pfGrid');
      var pfPanel = document.getElementById('pfPanel');
      var pfLb    = document.getElementById('pfLb');
      var lbIdx   = 0;
      var lbWorks = [];
      var activeCat    = 'all';
      var activeClient = 'all';

      /* ── Client chips row ── */
      var chipsRow = document.getElementById('pfChipsRow');

      function buildChips(cat) {
        var list = cat === 'all' ? [] : (CLIENTS.filter(function(c){ return c.cat === cat; }));
        /* hide row if no category selected or only 0–1 clients */
        if (list.length < 1) {
          chipsRow.classList.remove('open');
          chipsRow.innerHTML = '<span class="pf-chips-label">អតិថិជន</span>';
          activeClient = 'all';
          return;
        }
        chipsRow.innerHTML =
          '<span class="pf-chips-label">អតិថិជន</span>' +
          '<button class="pf-chip active" data-client="all">ទាំងអស់</button>' +
          list.map(function(c) {
            return '<button class="pf-chip" data-client="' + c.id + '">' + c.name + '</button>';
          }).join('');
        activeClient = 'all';
        chipsRow.classList.add('open');

        chipsRow.querySelectorAll('.pf-chip').forEach(function(chip, i) {
          chip.style.animation = 'pf-chipIn 0.3s cubic-bezier(0.16,1,0.3,1) ' + (i * 50) + 'ms both';
          chip.addEventListener('click', function() {
            chipsRow.querySelectorAll('.pf-chip').forEach(function(ch){ ch.classList.remove('active'); });
            chip.classList.add('active');
            activeClient = chip.dataset.client;
            renderGrid();
          });
        });
      }

      buildChips('all');

      /* ── Update category tab counts ── */
      var cats = ['design','marketing','web','event'];
      document.getElementById('cnt-all').textContent = CLIENTS.length;
      cats.forEach(function(c) {
        var el = document.getElementById('cnt-' + c);
        if (el) el.textContent = CLIENTS.filter(function(cl){ return cl.cat === c; }).length;
      });

      /* ── Render cover grid (combined filter) ── */
      function renderGrid() {
        var list = CLIENTS.filter(function(c) {
          var catOk    = activeCat    === 'all' || c.cat === activeCat;
          var clientOk = activeClient === 'all' || c.id  === activeClient;
          return catOk && clientOk;
        });
        if (!list.length) {
          pfGrid.innerHTML = '<div class="pf-empty"><i class="fas fa-layer-group"></i><p>ស្នាដៃបន្ថែមឆាប់ៗ — Coming soon</p></div>';
          return;
        }
        pfGrid.innerHTML = list.map(function(client) {
          var randIdx = Math.floor(Math.random() * client.works.length);
          var cover   = client.works[randIdx].img;
          var ar      = client.aspect || '3/4';
          return '<div class="pf-cover" data-id="' + client.id + '" style="aspect-ratio:' + ar + '">' +
            '<img src="' + cover + '" alt="' + client.name + '" loading="lazy" />' +
            '<span class="pf-cov-badge" data-cat="' + client.cat + '">' + client.catLabel + '</span>' +
            '<span class="pf-cov-count">' + client.works.length + ' ស្នាដៃ</span>' +
            '<div class="pf-cov-overlay">' +
              '<div class="pf-cov-meta">' + client.tagline + '</div>' +
              '<div class="pf-cov-name">' + client.name + '</div>' +
              '<div class="pf-cov-action"><i class="fas fa-arrow-right"></i> មើលការងារ</div>' +
            '</div>' +
          '</div>';
        }).join('');

        pfGrid.querySelectorAll('.pf-cover').forEach(function(card, i) {
          /* stagger fade-up */
          card.style.animation = 'pf-fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) ' + (i * 55) + 'ms both';

          /* hover parallax */
          card.addEventListener('mousemove', function(e) {
            var r = card.getBoundingClientRect();
            var x = (e.clientX - r.left) / r.width  - 0.5;
            var y = (e.clientY - r.top)  / r.height - 0.5;
            card.querySelector('img').style.transform =
              'scale(1.08) translate(' + (x * 14) + 'px,' + (y * 10) + 'px)';
          });
          card.addEventListener('mouseleave', function() {
            card.querySelector('img').style.transform = '';
          });

          card.addEventListener('click', function() { openPanel(card.dataset.id); });
        });
      }

      /* ── Category filter ── */
      document.querySelectorAll('#pfTabs .pf-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('#pfTabs .pf-tab').forEach(function(t){ t.classList.remove('active'); });
          tab.classList.add('active');
          activeCat = tab.dataset.cat;
          buildChips(activeCat);
          renderGrid();
        });
      });

      /* ── Open client panel ── */
      function openPanel(clientId) {
        var client = CLIENTS.find(function(c){ return c.id === clientId; });
        if (!client) return;

        document.getElementById('pfPanBarTitle').textContent = client.name;
        document.getElementById('pfPanBarTag').textContent   = '· ' + client.catLabel;
        document.getElementById('pfPanBarCount').textContent = client.works.length + ' ស្នាដៃ';
        var logoEl = document.getElementById('pfPanLogo');
        logoEl.innerHTML = client.logo
          ? '<img src="' + client.logo + '" alt="' + client.name + ' logo" />'
          : client.emoji;
        document.getElementById('pfPanName').textContent     = client.name;
        document.getElementById('pfPanTagline').textContent  = client.tagline;

        var badge = document.getElementById('pfPanBadge');
        badge.textContent     = client.catLabel;
        badge.dataset.cat     = client.cat;

        var ar      = client.aspect || '3/4';
        var panGrid = document.getElementById('pfPanGrid');
        panGrid.innerHTML = client.works.map(function(w, i) {
          return '<div class="pf-pan-item" data-idx="' + i + '" style="aspect-ratio:' + ar + '">' +
            '<img src="' + w.img + '" alt="' + w.name + '" loading="lazy" />' +
            '<div class="pf-pan-item-overlay"><span class="pf-pan-item-name">' + w.name + '</span></div>' +
          '</div>';
        }).join('');

        panGrid.querySelectorAll('.pf-pan-item').forEach(function(item, i) {
          item.style.animation = 'pf-panIn 0.4s cubic-bezier(0.16,1,0.3,1) ' + (i * 40) + 'ms both';
          item.addEventListener('click', function() {
            lbWorks = client.works;
            lbIdx   = parseInt(item.dataset.idx);
            lbOpen(client.name);
          });
        });

        pfPanel.classList.add('open');
        pfPanel.scrollTop = 0;
        document.addEventListener('keydown', panKey);
      }

      function closePanel() {
        pfPanel.classList.remove('open');
        document.removeEventListener('keydown', panKey);
      }

      function panKey(e) { if (e.key === 'Escape') closePanel(); }
      document.getElementById('pfPanBack').addEventListener('click', closePanel);

      /* ── Lightbox ── */
      function lbShow(clientName, dir) {
        var img = document.getElementById('pfLbImg');
        var w   = lbWorks[lbIdx];
        /* direction slide */
        if (dir) {
          img.classList.remove('dir-next', 'dir-prev');
          void img.offsetWidth; /* reflow to restart animation */
          img.classList.add(dir === 1 ? 'dir-next' : 'dir-prev');
        }
        img.src = w.img;
        img.alt = w.name;
        document.getElementById('pfLbClient').textContent = clientName || '';
        document.getElementById('pfLbName').textContent   = w.name;
        document.getElementById('pfLbCtr').textContent    = (lbIdx + 1) + ' / ' + lbWorks.length;
      }

      var _lbClient = '';
      function lbOpen(clientName) {
        _lbClient = clientName;
        lbShow(clientName, 0);
        pfLb.classList.add('open');
        document.addEventListener('keydown', lbKey);
      }
      function lbClose() {
        pfLb.classList.remove('open');
        document.removeEventListener('keydown', lbKey);
      }
      function lbNav(dir) {
        lbIdx = (lbIdx + dir + lbWorks.length) % lbWorks.length;
        lbShow(_lbClient, dir);
      }
      function lbKey(e) {
        if (e.key === 'Escape')     lbClose();
        if (e.key === 'ArrowLeft')  lbNav(-1);
        if (e.key === 'ArrowRight') lbNav(1);
      }

      document.getElementById('pfLbClose').addEventListener('click', lbClose);
      pfLb.addEventListener('click', function(e){ if (e.target === pfLb) lbClose(); });
      document.getElementById('pfLbPrev').addEventListener('click', function(e){ e.stopPropagation(); lbNav(-1); });
      document.getElementById('pfLbNext').addEventListener('click', function(e){ e.stopPropagation(); lbNav(1); });

      /* ── Init ── */
      renderGrid();
    })();
    </script>

    <script src="js/load-components.js"></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
